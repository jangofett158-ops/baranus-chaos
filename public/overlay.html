<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Baranus Chaos — оверлей</title>
<style>
  :root { --accent: #e8263a; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
  #stack { position: absolute; display: flex; flex-direction: column; gap: 16px; width: 640px; }
  #stack.bottom-left { left: 40px; bottom: 40px; flex-direction: column-reverse; }
  #stack.bottom-right { right: 40px; bottom: 40px; flex-direction: column-reverse; align-items: flex-end; }
  #stack.top-left { left: 40px; top: 40px; }
  #stack.top-right { right: 40px; top: 40px; align-items: flex-end; }
  .alert {
    display: flex; align-items: center; gap: 22px; width: fit-content; max-width: 640px; padding: 20px 30px 20px 20px;
    border-radius: 24px; background: linear-gradient(120deg, rgba(24, 12, 14, .94), rgba(64, 14, 22, .94));
    border: 2px solid var(--accent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent), 0 18px 50px rgba(0, 0, 0, .55);
    animation: enter .45s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  .alert.leave { animation: leave .35s ease forwards; }
  .icon {
    width: 92px; height: 92px; flex: none; display: grid; place-items: center; font-size: 54px; border-radius: 22px;
    background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--accent) 70%, #fff 10%), color-mix(in srgb, var(--accent) 35%, #000));
  }
  .text { display: flex; flex-direction: column; min-width: 0; }
  .text small { font-size: 14px; font-weight: 800; letter-spacing: .32em; color: color-mix(in srgb, var(--accent) 55%, #fff); }
  .text b { font-family: "Segoe UI Black", "Segoe UI", sans-serif; font-weight: 900; font-size: 38px; line-height: 1.1; text-transform: uppercase; overflow-wrap: anywhere; }
  .text span { font-size: 22px; font-weight: 700; color: #e6dcff; overflow-wrap: anywhere; }
  .text span em { font-style: normal; color: #fff; background: var(--accent); padding: 1px 10px; border-radius: 8px; margin-left: 6px; }
  @keyframes enter { from { opacity: 0; transform: translateY(24px) scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes leave { to { opacity: 0; transform: translateY(-12px) scale(.96); } }
</style>
<script src="/overlay.js" defer></script>
</head>
<body><div id="stack" class="bottom-left"></div></body>
</html>
